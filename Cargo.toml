[workspace]
resolver = "2"
members = ["crates/core", "crates/abi", "crates/wasm", "crates/capi"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
coffee-core = { path = "crates/core" }
coffee-abi = { path = "crates/abi" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
miniz_oxide = "0.8"
crc32fast = "1"
base64 = "0.22"
regex-lite = "0.1"

[profile.release]
opt-level = "s"
lto = true
# panics unwind so that the C ABI turns them into `internal` errors (wasm32 always aborts)
codegen-units = 1
strip = true
