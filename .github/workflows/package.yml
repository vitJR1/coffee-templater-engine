name: package

# Builds the distributable package on every push to main and publishes it as the rolling
# "nightly" pre-release. Tags v* publish a versioned GitHub Release with the same files.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wasm:
    name: coffee_core.wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: make test
      - run: make conformance
      - name: Assemble package
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="coffee-core") | .version')
          PKG=coffee-core-$VERSION-wasm
          mkdir -p "pkg/$PKG"
          cp dist/coffee_core.wasm LICENSE README.md DOCS.md "pkg/$PKG/"
          cp -r schema "pkg/$PKG/schema"
          (cd pkg && tar czf "$PKG.tar.gz" "$PKG" && sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256")
          sha256sum dist/coffee_core.wasm > pkg/coffee_core.wasm.sha256
          cp dist/coffee_core.wasm pkg/
      - uses: actions/upload-artifact@v4
        with:
          name: coffee-core-wasm
          path: |
            pkg/*.tar.gz
            pkg/*.sha256
            pkg/coffee_core.wasm

  native:
    name: C ABI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build -p coffee-capi --release --target ${{ matrix.target }}
      - name: Assemble package
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="coffee-core") | .version')
          PKG=coffee-core-$VERSION-${{ matrix.target }}
          OUT=target/${{ matrix.target }}/release
          mkdir -p "pkg/$PKG/lib" "pkg/$PKG/include"
          cp crates/capi/include/coffee_core.h "pkg/$PKG/include/"
          cp LICENSE README.md DOCS.md "pkg/$PKG/"
          for f in libcoffee_core_capi.a libcoffee_core_capi.so libcoffee_core_capi.dylib coffee_core_capi.dll coffee_core_capi.dll.lib coffee_core_capi.lib; do
            [ -f "$OUT/$f" ] && cp "$OUT/$f" "pkg/$PKG/lib/"
          done
          cd pkg
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$PKG.zip" "$PKG" > /dev/null
          else
            tar czf "$PKG.tar.gz" "$PKG"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coffee-core-${{ matrix.target }}
          path: |
            pkg/*.tar.gz
            pkg/*.zip

  release:
    name: GitHub Release (${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }})
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [wasm, native]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # push to main: rolling pre-release "nightly", recreated on the current commit
      - name: Publish nightly
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (${GITHUB_SHA::7})" \
            --notes "Built from ${GITHUB_SHA} on main. Not a stable release: use a v* release for production."
      # tag v*: versioned release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
